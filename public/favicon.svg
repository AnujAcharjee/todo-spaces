<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="12" y="12" width="104" height="104" rx="28" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Inner Glass Accent -->
  <rect x="16" y="16" width="96" height="96" rx="24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  
  <!-- Checkmark Path -->
  <path d="M40 64 L56 80 L90 44" fill="none" stroke="url(#checkGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Space/Star Accent -->
  <circle cx="88" cy="36" r="3.5" fill="#ffffff" opacity="0.9" />
  <circle cx="36" cy="38" r="2.5" fill="#ffffff" opacity="0.6" />
</svg>
